asyncapi: '2.2.0'
info:
  title: Rural Game 2 Real-Time API
  version: '{{API_VERSION}}'
  description: |
    Real-time API for lobby management and game control in Rural Game 2.
    This specification describes the Socket.IO events used to manage lobbies,
    handle player actions and broadcast game state. The events are published
    and subscribed over a WebSocket endpoint using Socket.IO. Profile pictures
    are served over HTTP but referenced in events via absolute URLs.

servers:
  production:
    url: ws://ruralgame.ddns.net{PREFIX}/lobby
    protocol: ws
    description: Production WebSocket server for the lobby namespace.
    variables:
      PREFIX:
        default: /api/v1
        description: API prefix (namespace root)
  local:
    url: ws://localhost:5000{PREFIX}/lobby
    protocol: ws
    description: Local development WebSocket server (Flask-SocketIO).
    variables:
      PREFIX:
        default: /api/v1
        description: API prefix (namespace root)

channels:
  create_lobby:
    description: Client requests to create a new lobby.
    publish:
      operationId: createLobby
      summary: Create a new lobby with the provided player information.
      message:
        $ref: '#/components/messages/CreateLobby'

  join_lobby:
    description: Client requests to join a lobby.
    publish:
      operationId: joinLobby
      summary: Join an existing lobby by code.
      message:
        $ref: '#/components/messages/JoinLobby'

  leave_lobby:
    description: Client requests to leave a lobby.
    publish:
      operationId: leaveLobby
      summary: Leave the specified lobby.
      message:
        $ref: '#/components/messages/LeaveLobby'

  start_game:
    description: Client requests to start the game for a lobby.
    publish:
      operationId: startGame
      summary: Start the game in the specified lobby.
      message:
        $ref: '#/components/messages/StartGame'

  update_player:
    description: Client requests to update their player information.
    publish:
      operationId: updatePlayer
      summary: Update player information in the lobby.
      message:
        $ref: '#/components/messages/UpdatePlayer'

  update_profile_picture:
    description: Client requests to add, replace or remove a player's profile picture.
    publish:
      operationId: updateProfilePicture
      summary: Update a player's profile picture (send base64 or data URL; or remove it).
      message:
        $ref: '#/components/messages/UpdateProfilePicture'

  get_user_info:
    description: Client requests to get their own player information.
    publish:
      operationId: getUserInfo
      summary: Retrieve the player's own information.
      message:
        $ref: '#/components/messages/GetUserInfo'

  player_joined:
    description: Notification sent when a player joins a lobby.
    subscribe:
      operationId: playerJoined
      summary: Receive information about the player that just joined.
      message:
        $ref: '#/components/messages/PlayerJoined'

  player_left:
    description: Notification sent when a player leaves a lobby.
    subscribe:
      operationId: playerLeft
      summary: Receive information about the player that just left.
      message:
        $ref: '#/components/messages/PlayerLeft'

  game_started:
    description: Notification sent when the game starts.
    subscribe:
      operationId: gameStarted
      summary: Receive the initial game state after the game has started.
      message:
        $ref: '#/components/messages/GameStarted'

  player_updated:
    description: Notification sent when a player updates their information.
    subscribe:
      operationId: playerUpdated
      summary: Receive updated player information after a player update.
      message:
        $ref: '#/components/messages/PlayerUpdated'

  profile_picture_updated:
    description: Notification sent when a player's profile picture is updated or removed.
    subscribe:
      operationId: profilePictureUpdated
      summary: Receive the new profile picture URL (or removal flag).
      message:
        $ref: '#/components/messages/ProfilePictureUpdated'

  error:
    description: Error notifications related to lobby or game operations.
    subscribe:
      operationId: error
      summary: Receive error messages for failed operations.
      message:
        $ref: '#/components/messages/Error'

components:
  messages:
    CreateLobby:
      name: CreateLobby
      title: Create Lobby
      summary: Message sent by the client to create a new lobby.
      payload:
        type: object
        required:
          - player
        properties:
          player:
            $ref: '#/components/schemas/PlayerInfo'

    JoinLobby:
      name: JoinLobby
      title: Join Lobby
      summary: Message sent by the client to join a lobby.
      payload:
        type: object
        required:
          - code
          - player
        properties:
          code:
            $ref: '#/components/schemas/LobbyCode'
          player:
            $ref: '#/components/schemas/PlayerInfo'

    LeaveLobby:
      name: LeaveLobby
      title: Leave Lobby
      summary: Message sent by the client to leave a lobby.
      payload:
        type: object
        required:
          - code
          - player_name
        properties:
          code:
            $ref: '#/components/schemas/LobbyCode'
          player_name:
            type: string
            description: Username of the player leaving.

    StartGame:
      name: StartGame
      title: Start Game
      summary: Message sent by the client to initiate the game in a lobby.
      payload:
        type: object
        required:
          - code
          - player_name
        properties:
          code:
            $ref: '#/components/schemas/LobbyCode'
          player_name:
            type: string
            description: Host username who is starting the game.

    UpdatePlayer:
      name: UpdatePlayer
      title: Update Player
      summary: Message sent by the client to update their player information.
      payload:
        type: object
        required:
          - code
          - current_username
        properties:
          code:
            $ref: '#/components/schemas/LobbyCode'
          current_username:
            type: string
            description: Current username of the player to update.
          new_username:
            type: string
            description: New username for the player (optional).
          drinking:
            type: boolean
            description: Whether the player drinks alcohol (optional).
          smoking:
            type: boolean
            description: Whether the player smokes (optional).
          partnered:
            type: boolean
            description: Whether the player is in a relationship (optional).
          virgin:
            type: boolean
            description: Whether the player is a virgin (optional).
          gender:
            $ref: '#/components/schemas/GenderEnum'
            description: Gender of the player (optional).

    UpdateProfilePicture:
      name: UpdateProfilePicture
      title: Update Profile Picture
      summary: Add/replace/remove a player's profile picture in a lobby.
      payload:
        $ref: '#/components/schemas/UpdateProfilePicturePayload'

    GetUserInfo:
      name: GetUserInfo
      title: Get User Info
      summary: Message sent by the client to retrieve their own player information.
      payload:
        type: object
        required:
          - code
          - player_name
        properties:
          code:
            $ref: '#/components/schemas/LobbyCode'
          player_name:
            type: string
            description: Username of the player requesting their information.

    PlayerJoined:
      name: PlayerJoined
      title: Player Joined
      summary: Notification that a new player has joined a lobby.
      payload:
        type: object
        required:
          - player
        properties:
          player:
            type: string
            description: Username of the player who joined.
          profile_picture_url:
            type: string
            format: uri
            nullable: true
            description: Absolute URL to the player's profile picture (may include cache-buster).

    PlayerLeft:
      name: PlayerLeft
      title: Player Left
      summary: Notification that a player has left a lobby.
      payload:
        type: object
        required:
          - player
          - host
        properties:
          player:
            type: string
            description: Username of the player who left.
          host:
            type: string
            nullable: true
            description: Username of the current host after the player left, or null if the lobby was removed.

    GameStarted:
      name: GameStarted
      title: Game Started
      summary: Notification that the game has started and includes the full game state.
      payload:
        $ref: '#/components/schemas/GameState'

    PlayerUpdated:
      name: PlayerUpdated
      title: Player Updated
      summary: Notification that a player has updated their information.
      payload:
        type: object
        required:
          - old_username
          - new_username
        properties:
          old_username:
            type: string
            description: Previous username of the player.
          new_username:
            type: string
            description: New username of the player.
          profile_picture_url:
            type: string
            format: uri
            nullable: true
            description: Absolute URL to the player's current profile picture (may include cache-buster).

    ProfilePictureUpdated:
      name: ProfilePictureUpdated
      title: Profile Picture Updated
      summary: Notification that a player's profile picture has changed or was removed.
      payload:
        type: object
        required:
          - player
          - removed
        properties:
          player:
            type: string
            description: Username whose picture changed.
          profile_picture_url:
            type: string
            format: uri
            nullable: true
            description: Absolute URL to the new profile picture (present when removed = false).
          removed:
            type: boolean
            description: True if the picture was removed; otherwise false.

    Error:
      name: Error
      title: Error
      summary: Error message emitted by the server when an operation fails.
      payload:
        type: object
        properties:
          message:
            type: string
            description: Human-readable error message.

  schemas:
    LobbyCode:
      type: string
      description: Unique 4-digit lobby code.
      pattern: '^[0-9]{4}$'

    GenderEnum:
      type: string
      description: Gender of the player.
      enum:
        - male
        - female

    PlayerInfo:
      type: object
      description: Static information about a player provided when they join a lobby.
      required:
        - username
        - drinking
        - smoking
        - partnered
        - virgin
        - gender
      properties:
        username:
          type: string
          description: Unique username of the player.
        drinking:
          type: boolean
          description: Whether the player drinks alcohol.
        smoking:
          type: boolean
          description: Whether the player smokes.
        partnered:
          type: boolean
          description: Whether the player is in a relationship.
        virgin:
          type: boolean
          description: Whether the player is a virgin.
        gender:
          $ref: '#/components/schemas/GenderEnum'
        profile_pic:
          type: string
          nullable: true
          description: Optional identifier for the player's profile picture (generally not used at join time).

    PlayerState:
      type: object
      description: Dynamic state of a player within a lobby.
      required:
        - username
        - points
        - secret_missions
        - connected
      properties:
        username:
          type: string
          description: Username of the player.
        points:
          type: integer
          description: Current score of the player.
        role:
          type: string
          nullable: true
          description: Role assigned to the player in the current game.
        secret_missions:
          type: array
          items:
            type: string
          description: List of secret missions assigned to the player.
        connected:
          type: boolean
          description: Indicates if the player is currently connected via websocket.

    ConnectedPlayer:
      type: object
      description: Connected player plus a URL to their profile picture.
      required:
        - username
      properties:
        username:
          type: string
        profile_picture_url:
          type: string
          format: uri
          nullable: true

    GameState:
      type: object
      description: Full state of a lobby including lobby metadata, players and turn order.
      properties:
        lobby:
          type: object
          description: Metadata about the lobby (e.g., creation time, current turn).
        players:
          type: object
          description: Mapping of usernames to their dynamic state.
          additionalProperties:
            $ref: '#/components/schemas/PlayerState'
        order:
          type: array
          items:
            type: string
          description: Ordered list of usernames representing turn rotation.

    UpdateProfilePicturePayload:
      type: object
      description: |
        Update or remove a player's profile picture.

        To remove:
          - Set `remove: true`. All other image fields are optional/ignored.

        To upload/replace, provide EXACTLY ONE of the following inputs:
          1) `image_base64` (raw base64 content) + `extension`
          2) `image_base64` (raw base64 content) + `filename` (the file extension is inferred)
          3) `data_url` formatted as `data:image/<ext>;base64,<content>` (the file extension is inferred)

        Notes:
          - Supported extensions are typically: png, jpg, jpeg, gif (configurable on the server).
          - Do not send both `data_url` and `image_base64` at the same time.
          - The server stores a relative file path in Redis but responds/announces a cache-busted URL for clients.
          - When replacing a picture, the previous file on disk is removed.

      required:
        - code
        - player_name
      properties:
        code:
          $ref: '#/components/schemas/LobbyCode'
        player_name:
          type: string
          description: Username whose picture will be updated.
        remove:
          type: boolean
          default: false
          description: When true, removes the current profile picture.
        data_url:
          type: string
          description: Data URL of the image (e.g. "data:image/png;base64,<...>").
          pattern: '^data:image\/[A-Za-z0-9]+;base64,.+'
        image_base64:
          type: string
          description: Raw base64-encoded image bytes (use when not sending a full data URL).
        extension:
          type: string
          description: File extension to use when saving the image (ignored if `data_url` provides it).
          enum: [png, jpg, jpeg, gif]
        filename:
          type: string
          description: Optional original filename (may be used to infer extension).
      anyOf:
        - properties:
            remove:
              const: true
          required: [code, player_name, remove]
          description: Remove the current profile picture.
        - anyOf:
            - required: [code, player_name, data_url]
            - required: [code, player_name, image_base64, extension]
          description: Upload or replace the profile picture.
