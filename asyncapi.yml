asyncapi: '2.2.0'
info:
  title: Rural Game 2 Real-Time API
  version: '{{API_VERSION}}'
  description: |
    Real-time API for lobby management and game control in Rural Game 2.
    This AsyncAPI describes the Socket.IO namespace for lobbies, players, turns, voting flows, and utility events.

servers:
  production:
    url: ws://ruralgame.ddns.net{PREFIX}/game
    protocol: ws
    description: Production WebSocket server for the lobby and game namespace.
    variables:
      PREFIX:
        default: /api/v1
        description: API prefix (namespace root)
  local:
    url: ws://localhost:5000{PREFIX}/game
    protocol: ws
    description: Local development WebSocket server (Flask-SocketIO).
    variables:
      PREFIX:
        default: /api/v1
        description: API prefix (namespace root)

channels:
  # ======================
  # Client -> Server (publish)
  # ======================

  create_lobby:
    description: Client requests to create a new lobby.
    publish:
      operationId: createLobby
      summary: Create a new lobby with the provided player information.
      message:
        $ref: '#/components/messages/CreateLobby'
      x-ack:
        oneOf:
          - $ref: '#/components/schemas/AckCreateLobbySuccess'
          - $ref: '#/components/schemas/AckError'

  join_lobby:
    description: Client requests to join a lobby.
    publish:
      operationId: joinLobby
      summary: Join an existing lobby by code.
      message:
        $ref: '#/components/messages/JoinLobby'
      x-ack:
        oneOf:
          - $ref: '#/components/schemas/AckJoinLobbySuccess'
          - $ref: '#/components/schemas/AckError'

  leave_lobby:
    description: Client requests to leave a lobby.
    publish:
      operationId: leaveLobby
      summary: Leave the specified lobby.
      message:
        $ref: '#/components/messages/LeaveLobby'
      x-ack:
        oneOf:
          - $ref: '#/components/schemas/AckLeaveLobbySuccess'
          - $ref: '#/components/schemas/AckError'

  start_game:
    description: Client requests to start the game for a lobby.
    publish:
      operationId: startGame
      summary: Start the game in the specified lobby.
      message:
        $ref: '#/components/messages/StartGame'
      x-ack:
        oneOf:
          - $ref: '#/components/schemas/AckOkOnly'
          - $ref: '#/components/schemas/AckError'

  update_player:
    description: Client requests to update their player information.
    publish:
      operationId: updatePlayer
      summary: Update player information in the lobby.
      message:
        $ref: '#/components/messages/UpdatePlayer'
      x-ack:
        oneOf:
          - $ref: '#/components/schemas/AckUpdatePlayerSuccess'
          - $ref: '#/components/schemas/AckError'

  update_profile_picture:
    description: Client requests to add, replace or remove a player's profile picture.
    publish:
      operationId: updateProfilePicture
      summary: Update a player's profile picture (send base64 or data URL; or remove it).
      message:
        $ref: '#/components/messages/UpdateProfilePicture'
      x-ack:
        oneOf:
          - $ref: '#/components/schemas/AckUpdateProfilePictureSuccess'
          - $ref: '#/components/schemas/AckError'

  get_user_info:
    description: Client requests to get their own player information.
    publish:
      operationId: getUserInfo
      summary: Retrieve the player's own information.
      message:
        $ref: '#/components/messages/GetUserInfo'
      x-ack:
        oneOf:
          - $ref: '#/components/schemas/AckGetUserInfoSuccess'
          - $ref: '#/components/schemas/AckError'

  next_turn:
    description: Client requests to progress to the next turn with a given turn type.
    publish:
      operationId: nextTurn
      summary: Progress to the next turn and trigger a new challenge broadcast.
      message:
        $ref: '#/components/messages/NextTurn'
      x-ack:
        description: |
          Ack varies by turn type:
            - challenge_type, group_challenge_type => { ok: true }
            - secret_mission_type, target_challenge_type => { ok: true, challenge: {...} }
        oneOf:
          - $ref: '#/components/schemas/AckOkOnly'
          - $ref: '#/components/schemas/AckNextTurnChallengeSuccess'
          - $ref: '#/components/schemas/AckError'

  choose_target:
    description: Client selects players for a target challenge (replaces placeholders in description).
    publish:
      operationId: chooseTarget
      summary: Submit the final description with chosen target players.
      message:
        $ref: '#/components/messages/ChooseTarget'
      x-ack:
        oneOf:
          - $ref: '#/components/schemas/AckOkOnly'
          - $ref: '#/components/schemas/AckError'

  skip_turn:
    description: Client requests to skip a challenge (if skipping is allowed).
    publish:
      operationId: skipTurn
      summary: Skip the current challenge; only the requester gets the penalty if involved.
      message:
        $ref: '#/components/messages/SkipOrCompleteTurn'
      x-ack:
        oneOf:
          - $ref: '#/components/schemas/AckOkOnly'
          - $ref: '#/components/schemas/AckError'

  complete_turn:
    description: Client confirms a challenge has been completed.
    publish:
      operationId: completeTurn
      summary: Complete the challenge; if voting is required, server starts the voting flow.
      message:
        $ref: '#/components/messages/SkipOrCompleteTurn'
      x-ack:
        oneOf:
          - $ref: '#/components/schemas/AckCompleteTurnVoting'
          - $ref: '#/components/schemas/AckOkOnly'
          - $ref: '#/components/schemas/AckError'

  vote:
    description: Client submits a performance vote (0..10) for the last completed turn that needs voting.
    publish:
      operationId: vote
      summary: Submit a performance vote. Ineligible voters are rejected server-side.
      message:
        $ref: '#/components/messages/Vote'
      x-ack:
        oneOf:
          - $ref: '#/components/schemas/AckOkOnly'
          - $ref: '#/components/schemas/AckError'

  team_vote:
    description: Client selects the winning team when a group challenge has multiple teams.
    publish:
      operationId: teamVote
      summary: Submit a vote for the winning team (e.g., "Team0"). If all participate, the whole lobby votes.
      message:
        $ref: '#/components/messages/TeamVote'
      x-ack:
        oneOf:
          - $ref: '#/components/schemas/AckOkOnly'
          - $ref: '#/components/schemas/AckError'

  get_player_state:
    description: Client requests the current dynamic state of a player in a lobby.
    publish:
      operationId: getPlayerState
      summary: Retrieve a player's dynamic state (points, role, secret_missions, connected).
      message:
        $ref: '#/components/messages/GetPlayerState'
      x-ack:
        oneOf:
          - $ref: '#/components/schemas/AckGetPlayerStateSuccess'
          - $ref: '#/components/schemas/AckError'

  give_points:
    description: Client awards (or deducts) points to a player. Server broadcasts the change.
    publish:
      operationId: givePoints
      summary: Adjust a player's score by a signed integer (positive or negative).
      message:
        $ref: '#/components/messages/GivePoints'
      x-ack:
        oneOf:
          - $ref: '#/components/schemas/AckOkOnly'
          - $ref: '#/components/schemas/AckError'

  # ======================
  # Server -> Client (subscribe)
  # ======================

  player_joined:
    description: Notification when a player joins a lobby.
    subscribe:
      operationId: playerJoined
      summary: Receive information about the player that just joined.
      message:
        $ref: '#/components/messages/PlayerJoined'

  player_left:
    description: Notification when a player leaves a lobby.
    subscribe:
      operationId: playerLeft
      summary: Receive information about the player that just left.
      message:
        $ref: '#/components/messages/PlayerLeft'

  game_started:
    description: Notification when the game starts.
    subscribe:
      operationId: gameStarted
      summary: Receive the initial game state after the game has started.
      message:
        $ref: '#/components/messages/GameStarted'

  player_updated:
    description: Notification when a player updates their information.
    subscribe:
      operationId: playerUpdated
      summary: Receive updated player information after a player update.
      message:
        $ref: '#/components/messages/PlayerUpdated'

  profile_picture_updated:
    description: Notification when a player's profile picture is updated or removed.
    subscribe:
      operationId: profilePictureUpdated
      summary: Receive the new profile picture URL (or removal flag).
      message:
        $ref: '#/components/messages/ProfilePictureUpdated'

  next_turn_type:
    description: Broadcast announcing the next turn type right before resolving the challenge.
    subscribe:
      operationId: nextTurnType
      summary: Receive the next turn type (challenge / group_challenge / secret_mission / target_challenge).
      message:
        $ref: '#/components/messages/NextTurnType'

  following_turn:
    description: Broadcast with the next turn info (always includes participants; teams if any).
    subscribe:
      operationId: followingTurn
      summary: Receive the upcoming turn data (type, player, optional challenge, participants, and teams).
      message:
        oneOf:
          - $ref: '#/components/messages/FollowingTurnWithChallenge'
          - $ref: '#/components/messages/FollowingTurnWithoutChallenge'

  target_chosen:
    description: Broadcast when the target description is finalized for a target challenge.
    subscribe:
      operationId: targetChosen
      summary: Receive the finalized description and the performer.
      message:
        $ref: '#/components/messages/TargetChosen'

  turn_skipped:
    description: Broadcast when a turn has been skipped.
    subscribe:
      operationId: turnSkipped
      summary: Receive who skipped, turn type, title and resulting score.
      message:
        $ref: '#/components/messages/TurnSkipped'

  turn_completed_needs_voting:
    description: Broadcast when a completed turn requires performance voting (0..10).
    subscribe:
      operationId: turnCompletedNeedsVoting
      summary: Receive the potential prize and the turn metadata to start voting.
      message:
        $ref: '#/components/messages/TurnCompletedNeedsVoting'

  vote_progress:
    description: Broadcast vote progress for performance voting (who already voted).
    subscribe:
      operationId: voteProgress
      summary: Receive the list of voters and pending voters for the current performance vote.
      message:
        $ref: '#/components/messages/VoteProgress'

  vote_result:
    description: Broadcast final performance voting result and awarded points.
    subscribe:
      operationId: voteResult
      summary: Receive awarded points and updated scores when performance voting closes.
      message:
        $ref: '#/components/messages/VoteResult'

  team_vote_started:
    description: Broadcast when a team-winner vote is required (group challenge with multiple teams).
    subscribe:
      operationId: teamVoteStarted
      summary: Receive eligible voters and available teams to pick (Team0, Team1, ...).
      message:
        $ref: '#/components/messages/TeamVoteStarted'

  team_vote_progress:
    description: Broadcast vote progress for the team-winner selection.
    subscribe:
      operationId: teamVoteProgress
      summary: Receive who already voted and who is pending for team-winner selection.
      message:
        $ref: '#/components/messages/TeamVoteProgress'

  team_vote_result:
    description: Broadcast the winning team and its members after team voting closes.
    subscribe:
      operationId: teamVoteResult
      summary: Receive the winning team (TeamX) and members.
      message:
        $ref: '#/components/messages/TeamVoteResult'

  turn_completed:
    description: Broadcast when a turn was completed and no voting was needed OR after voting is applied and scores updated.
    subscribe:
      operationId: turnCompleted
      summary: Receive the player, type, title and the new score (or final awarded result).
      message:
        $ref: '#/components/messages/TurnCompleted'

  points_given:
    description: Broadcast when points are directly awarded to a player via give_points.
    subscribe:
      operationId: pointsGiven
      summary: Receive who got points, how many, and their new score.
      message:
        $ref: '#/components/messages/PointsGiven'

  error:
    description: Error notifications related to lobby or game operations.
    subscribe:
      operationId: error
      summary: Receive error messages for failed operations.
      message:
        $ref: '#/components/messages/Error'

components:
  messages:
    CreateLobby:
      name: CreateLobby
      title: Create Lobby
      summary: Message sent by the client to create a new lobby.
      payload:
        type: object
        required: [player]
        properties:
          player:
            $ref: '#/components/schemas/PlayerInfo'
      examples:
        - payload:
            player:
              username: "Alice"
              drinking: true
              smoking: false
              partnered: false
              virgin: false
              gender: male

    JoinLobby:
      name: JoinLobby
      title: Join Lobby
      summary: Message sent by the client to join a lobby.
      payload:
        type: object
        required: [code, player]
        properties:
          code:
            $ref: '#/components/schemas/LobbyCode'
          player:
            $ref: '#/components/schemas/PlayerInfo'
      examples:
        - payload:
            code: "1234"
            player:
              username: "Bob"
              drinking: false
              smoking: false
              partnered: true
              virgin: false
              gender: female

    LeaveLobby:
      name: LeaveLobby
      title: Leave Lobby
      summary: Message sent by the client to leave a lobby.
      payload:
        type: object
        required: [code, player_name]
        properties:
          code:
            $ref: '#/components/schemas/LobbyCode'
          player_name:
            type: string
            description: Username of the player leaving.
      examples:
        - payload: { code: "1234", player_name: "Alice" }

    StartGame:
      name: StartGame
      title: Start Game
      summary: Message sent by the client to initiate the game in a lobby.
      payload:
        type: object
        required: [code, player_name]
        properties:
          code:
            $ref: '#/components/schemas/LobbyCode'
          player_name:
            type: string
            description: Host username who is starting the game.
      examples:
        - payload: { code: "1234", player_name: "Alice" }

    UpdatePlayer:
      name: UpdatePlayer
      title: Update Player
      summary: Message sent by the client to update their player information.
      payload:
        type: object
        required: [code, current_username]
        properties:
          code:
            $ref: '#/components/schemas/LobbyCode'
          current_username:
            type: string
          new_username:
            type: string
          drinking:
            type: boolean
          smoking:
            type: boolean
          partnered:
            type: boolean
          virgin:
            type: boolean
          gender:
            $ref: '#/components/schemas/GenderEnum'
      examples:
        - payload:
            code: "1234"
            current_username: "Bob"
            new_username: "Rob"

    UpdateProfilePicture:
      name: UpdateProfilePicture
      title: Update Profile Picture
      summary: Add/replace/remove a player's profile picture in a lobby.
      payload:
        $ref: '#/components/schemas/UpdateProfilePicturePayload'
      examples:
        - payload:
            code: "1234"
            player_name: "Alice"
            data_url: "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA..."

    GetUserInfo:
      name: GetUserInfo
      title: Get User Info
      summary: Message sent by the client to retrieve their own player information.
      payload:
        type: object
        required: [code, player_name]
        properties:
          code:
            $ref: '#/components/schemas/LobbyCode'
          player_name:
            type: string
      examples:
        - payload: { code: "1234", player_name: "Alice" }

    NextTurn:
      name: NextTurn
      title: Next Turn
      summary: Client requests to advance the turn and generate a challenge of the specified type.
      payload:
        type: object
        required: [code, turn_type]
        properties:
          code:
            $ref: '#/components/schemas/LobbyCode'
          turn_type:
            $ref: '#/components/schemas/TurnTypeEnum'
      examples:
        - payload: { code: "1234", turn_type: "group_challenge_type" }

    ChooseTarget:
      name: ChooseTarget
      title: Choose Target
      summary: Client finalizes the target challenge description.
      payload:
        type: object
        required: [code, description]
        properties:
          code: { $ref: '#/components/schemas/LobbyCode' }
          description:
            type: string
            description: Final description with chosen names replacing the placeholders.
      examples:
        - payload:
            code: "1234"
            description: "Make {Alice} and {Rob} sing a duet."

    SkipOrCompleteTurn:
      name: SkipOrCompleteTurn
      title: Skip or Complete Turn
      summary: Used by skip_turn and complete_turn.
      payload:
        type: object
        required: [code, player_name, turn_type, title]
        properties:
          code: { $ref: '#/components/schemas/LobbyCode' }
          player_name: { type: string }
          turn_type: { $ref: '#/components/schemas/TurnTypeEnum' }
          title: { type: string }
      examples:
        - payload:
            code: "1234"
            player_name: "Alice"
            turn_type: "group_challenge_type"
            title: "Water flip challenge"

    Vote:
      name: Vote
      title: Performance Vote
      summary: Client sends a performance vote (0..10) for the current voting turn.
      payload:
        type: object
        required: [code, player_name, vote]
        properties:
          code: { $ref: '#/components/schemas/LobbyCode' }
          player_name: { type: string }
          vote:
            type: integer
            minimum: 0
            maximum: 10
      examples:
        - payload: { code: "1234", player_name: "Rob", vote: 8 }

    TeamVote:
      name: TeamVote
      title: Team Winner Vote
      summary: Client votes for the winning team (Team0, Team1, ...).
      payload:
        type: object
        required: [code, player_name, team]
        properties:
          code: { $ref: '#/components/schemas/LobbyCode' }
          player_name: { type: string }
          team:
            type: string
            description: Team identifier (e.g., Team0, Team1)
      examples:
        - payload: { code: "1234", player_name: "Eve", team: "Team0" }

    GetPlayerState:
      name: GetPlayerState
      title: Get Player State
      summary: Request the dynamic state of a player in a lobby.
      payload:
        type: object
        required: [code, player_name]
        properties:
          code: { $ref: '#/components/schemas/LobbyCode' }
          player_name: { type: string }
      examples:
        - payload: { code: "1234", player_name: "Alice" }

    GivePoints:
      name: GivePoints
      title: Give Points
      summary: Adjust a player's score by a signed integer; emits points_given on success.
      payload:
        type: object
        required: [code, player_name, points]
        properties:
          code: { $ref: '#/components/schemas/LobbyCode' }
          player_name:
            type: string
            description: Receiver username
          points:
            type: integer
            description: Positive to award, negative to deduct
      examples:
        - payload: { code: "1234", player_name: "Rob", points: 15 }

    PlayerJoined:
      name: PlayerJoined
      title: Player Joined
      summary: Notification that a new player has joined a lobby.
      payload:
        type: object
        required: [player]
        properties:
          player: { type: string }
          profile_picture_url:
            type: string
            format: uri
            nullable: true
      examples:
        - payload:
            player: "Charlie"
            profile_picture_url: "http://localhost:5000/api/v1/lobby/1234/user/Charlie/profile-picture"

    PlayerLeft:
      name: PlayerLeft
      title: Player Left
      summary: Notification that a player has left a lobby.
      payload:
        type: object
        required: [player, host]
        properties:
          player: { type: string }
          host:
            type: string
            nullable: true
      examples:
        - payload: { player: "Charlie", host: "Alice" }

    GameStarted:
      name: GameStarted
      title: Game Started
      summary: Notification that the game has started and includes the full game state.
      payload:
        $ref: '#/components/schemas/GameState'

    PlayerUpdated:
      name: PlayerUpdated
      title: Player Updated
      summary: Notification that a player has updated their information.
      payload:
        type: object
        required: [old_username, new_username]
        properties:
          old_username: { type: string }
          new_username: { type: string }
          profile_picture_url:
            type: string
            format: uri
            nullable: true

    ProfilePictureUpdated:
      name: ProfilePictureUpdated
      title: Profile Picture Updated
      summary: Notification that a player's profile picture has changed or was removed.
      payload:
        type: object
        required: [player, removed]
        properties:
          player: { type: string }
          profile_picture_url:
            type: string
            format: uri
            nullable: true
          removed: { type: boolean }

    NextTurnType:
      name: NextTurnType
      title: Next Turn Type
      summary: Announces the next turn type.
      payload:
        type: object
        required: [turn_type]
        properties:
          turn_type: { $ref: '#/components/schemas/TurnTypeEnum' }
      examples:
        - payload: { turn_type: "group_challenge_type" }

    FollowingTurnWithChallenge:
      name: FollowingTurnWithChallenge
      title: Following Turn (with challenge)
      summary: Broadcast for challenge/group_challenge turns (includes participants and teams).
      payload:
        type: object
        required: [turn_type, challenge, player, participants]
        properties:
          turn_type: { $ref: '#/components/schemas/TurnTypeEnum' }
          challenge: { $ref: '#/components/schemas/Challenge' }
          player: { type: string }
          participants:
            type: array
            items: { type: string }
          teams:
            type: array
            items: { $ref: '#/components/schemas/Team' }
            description: Present only when the challenge uses teams (Team0, Team1, ...).
      examples:
        - payload:
            turn_type: group_challenge_type
            player: "Alice"
            participants: ["Alice", "Rob"]
            teams:
              - name: Team0
                members: ["Alice"]
              - name: Team1
                members: ["Rob"]
            challenge:
              title: "Bottle flip"
              description: "Team duel between {player0:T0} and {player1:T1}"
              icon: "http://localhost:5000/api/v1/group_challenge/icon?title=Bottle%20flip"

    FollowingTurnWithoutChallenge:
      name: FollowingTurnWithoutChallenge
      title: Following Turn (without challenge)
      summary: Broadcast for secret_mission/target_challenge turns (includes participants array).
      payload:
        type: object
        required: [turn_type, player]
        properties:
          turn_type: { $ref: '#/components/schemas/TurnTypeEnum' }
          player: { type: string }
          participants:
            type: array
            items: { type: string }
          teams:
            type: array
            items: { $ref: '#/components/schemas/Team' }
      examples:
        - payload:
            turn_type: secret_mission_type
            player: "Alice"
            participants: ["Alice"]

    TargetChosen:
      name: TargetChosen
      title: Target Chosen
      summary: Broadcast when choose_target is accepted.
      payload:
        type: object
        required: [turn_type, description, player]
        properties:
          turn_type: { $ref: '#/components/schemas/TurnTypeEnum' }
          description: { type: string }
          player: { type: string }

    TurnSkipped:
      name: TurnSkipped
      title: Turn Skipped
      summary: Broadcast when a turn is skipped.
      payload:
        type: object
        required: [player, turn_type, title, new_score]
        properties:
          player: { type: string }
          turn_type: { $ref: '#/components/schemas/TurnTypeEnum' }
          title: { type: string }
          new_score: { type: integer }

    TurnCompletedNeedsVoting:
      name: TurnCompletedNeedsVoting
      title: Turn Completed (needs voting)
      summary: Broadcast when performance voting is required.
      payload:
        type: object
        required: [player, turn_type, title, potential_prize]
        properties:
          player: { type: string }
          turn_type: { $ref: '#/components/schemas/TurnTypeEnum' }
          title: { type: string }
          potential_prize:
            type: integer
            description: Maximum prize before applying vote factor.

    VoteProgress:
      name: VoteProgress
      title: Vote Progress
      summary: Broadcast who has voted and who is pending (performance voting).
      payload:
        type: object
        required: [kind, eligible_voters, voted, pending]
        properties:
          kind:
            type: string
            enum: [performance]
          eligible_voters:
            type: array
            items: { type: string }
          voted:
            type: array
            items: { type: string }
          pending:
            type: array
            items: { type: string }
          title:
            type: string
            description: Optional challenge title.
          performer:
            type: string
            description: Optional performer username.

    VoteResult:
      name: VoteResult
      title: Vote Result
      summary: Broadcast final result of performance voting and awarded points.
      payload:
        type: object
        required: [title, awarded, awarded_players]
        properties:
          title: { type: string }
          awarded:
            type: integer
            description: Awarded points per eligible participant (same value for all if group team won).
          awarded_players:
            type: array
            items:
              type: object
              required: [username, new_score]
              properties:
                username: { type: string }
                new_score: { type: integer }
          factor:
            type: number
            description: Vote factor in range [0, 1], derived from average(0..10)/10.
          winning_team:
            type: string
            description: If group challenge with teams, the team that got the award.

    TeamVoteStarted:
      name: TeamVoteStarted
      title: Team Vote Started
      summary: Broadcast when a group challenge has multiple teams and a winner must be chosen.
      payload:
        type: object
        required: [title, teams, eligible_voters]
        properties:
          title: { type: string }
          teams:
            type: array
            items: { $ref: '#/components/schemas/Team' }
          eligible_voters:
            type: array
            items: { type: string }

    TeamVoteProgress:
      name: TeamVoteProgress
      title: Team Vote Progress
      summary: Broadcast who has voted and who is pending (team winner selection).
      payload:
        type: object
        required: [kind, eligible_voters, voted, pending]
        properties:
          kind:
            type: string
            enum: [team]
          eligible_voters:
            type: array
            items: { type: string }
          voted:
            type: array
            items: { type: string }
          pending:
            type: array
            items: { type: string }
          title: { type: string }

    TeamVoteResult:
      name: TeamVoteResult
      title: Team Vote Result
      summary: Broadcast the winning team and members after the team vote closes.
      payload:
        type: object
        required: [title, winning_team, members]
        properties:
          title: { type: string }
          winning_team: { type: string }
          members:
            type: array
            items: { type: string }

    TurnCompleted:
      name: TurnCompleted
      title: Turn Completed
      summary: Broadcast when a turn is completed and (a) needed no voting or (b) voting is finished and scores updated.
      payload:
        type: object
        required: [player, turn_type, title, new_score]
        properties:
          player: { type: string }
          turn_type: { $ref: '#/components/schemas/TurnTypeEnum' }
          title: { type: string }
          new_score: { type: integer }

    PointsGiven:
      name: PointsGiven
      title: Points Given
      summary: Broadcast after a successful give_points operation.
      payload:
        type: object
        required: [player, points, new_score]
        properties:
          player: { type: string }
          points:
            type: integer
            description: Positive if awarded, negative if deducted
          new_score: { type: integer }
      examples:
        - payload: { player: "Rob", points: 15, new_score: 87 }

    Error:
      name: Error
      title: Error
      summary: Error message emitted by the server when an operation fails.
      payload:
        type: object
        properties:
          message:
            type: string
            description: Human-readable error message.

  schemas:
    # -----------------------
    # Common primitives/enums
    # -----------------------
    LobbyCode:
      type: string
      description: Unique 4-digit lobby code.
      pattern: '^[0-9]{4}$'

    GenderEnum:
      type: string
      description: Gender of the player.
      enum: [male, female]

    TurnTypeEnum:
      type: string
      description: Type of turn to progress to.
      enum: [challenge_type, group_challenge_type, secret_mission_type, target_challenge_type]

    Team:
      type: object
      required: [name, members]
      properties:
        name:
          type: string
          description: Team identifier (Team0, Team1, ...)
        members:
          type: array
          items: { type: string }

    # -----------------------
    # Domain models
    # -----------------------
    PlayerInfo:
      type: object
      required: [username, drinking, smoking, partnered, virgin, gender]
      properties:
        username: { type: string }
        drinking: { type: boolean }
        smoking: { type: boolean }
        partnered: { type: boolean }
        virgin: { type: boolean }
        gender: { $ref: '#/components/schemas/GenderEnum' }
        profile_pic:
          type: string
          nullable: true
          description: Optional identifier/relative path used internally.

    PlayerState:
      type: object
      required: [username, points, secret_missions, connected]
      properties:
        username: { type: string }
        points: { type: integer }
        role:
          type: string
          nullable: true
        secret_missions:
          type: array
          items: { type: string }
        connected: { type: boolean }

    ConnectedPlayer:
      type: object
      required: [username]
      properties:
        username: { type: string }
        profile_picture_url:
          type: string
          format: uri
          nullable: true

    GameState:
      type: object
      description: Full state of a lobby including lobby metadata, players, order and restrictions.
      properties:
        lobby:
          type: object
        players:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/PlayerState'
        order:
          type: array
          items: { type: string }
        restrictions:
          type: object
          properties:
            males: { type: integer, minimum: 0 }
            females: { type: integer, minimum: 0 }

    Challenge:
      type: object
      description: Generic challenge payload enriched by backend (includes icon URL).
      properties:
        title: { type: string }
        description: { type: string, nullable: true }
        males: { type: integer, nullable: true }
        females: { type: integer, nullable: true }
        icon:
          type: string
          format: uri

    UpdateProfilePicturePayload:
      type: object
      description: Update or remove a player's profile picture.
      required: [code, player_name]
      properties:
        code: { $ref: '#/components/schemas/LobbyCode' }
        player_name: { type: string }
        remove:
          type: boolean
          default: false
        data_url:
          type: string
          pattern: '^data:image\/[A-Za-z0-9]+;base64,.+'
        image_base64: { type: string }
        extension:
          type: string
          enum: [png, jpg, jpeg, gif]
        filename: { type: string }
      anyOf:
        - properties: { remove: { const: true } }
          required: [code, player_name, remove]
        - anyOf:
            - required: [code, player_name, data_url]
            - required: [code, player_name, image_base64, extension]

    # -----------------------
    # Ack payloads (Socket.IO)
    # -----------------------
    AckError:
      type: object
      required: [ok, error]
      properties:
        ok: { type: boolean, const: false }
        error: { type: string }

    AckOkOnly:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean, const: true }

    AckCreateLobbySuccess:
      type: object
      required: [ok, code, connected_players]
      properties:
        ok: { type: boolean, const: true }
        code: { $ref: '#/components/schemas/LobbyCode' }
        connected_players:
          type: array
          items: { $ref: '#/components/schemas/ConnectedPlayer' }

    AckJoinLobbySuccess:
      type: object
      required: [connected_players]
      properties:
        connected_players:
          type: array
          items: { $ref: '#/components/schemas/ConnectedPlayer' }

    AckLeaveLobbySuccess:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean, const: true }
        host:
          type: string
          nullable: true
          description: New host username, or null if lobby was removed.

    AckUpdatePlayerSuccess:
      type: object
      required: [ok, player, profile_picture_url]
      properties:
        ok: { type: boolean, const: true }
        player: { type: string }
        profile_picture_url:
          type: string
          format: uri

    AckGetUserInfoSuccess:
      type: object
      required: [ok, player_info]
      properties:
        ok: { type: boolean, const: true }
        player_info:
          type: object
          required: [username, drinking, smoking, partnered, virgin, gender, profile_picture_url]
          properties:
            username: { type: string }
            drinking: { type: boolean }
            smoking: { type: boolean }
            partnered: { type: boolean }
            virgin: { type: boolean }
            gender: { $ref: '#/components/schemas/GenderEnum' }
            profile_picture_url:
              type: string
              format: uri

    AckUpdateProfilePictureSuccess:
      type: object
      required: [ok, player, profile_picture_url, removed]
      properties:
        ok: { type: boolean, const: true }
        player: { type: string }
        profile_picture_url:
          type: string
          format: uri
        removed: { type: boolean }

    AckNextTurnChallengeSuccess:
      type: object
      description: Returned only for secret_mission and target_challenge.
      required: [ok, challenge]
      properties:
        ok: { type: boolean, const: true }
        challenge: { $ref: '#/components/schemas/Challenge' }

    AckCompleteTurnVoting:
      type: object
      description: Returned by complete_turn when voting is required.
      required: [ok, potential_prize, voting]
      properties:
        ok: { type: boolean, const: true }
        potential_prize: { type: integer }
        voting: { type: boolean, const: true }

    AckGetPlayerStateSuccess:
      type: object
      description: Returned by get_player_state with the player's dynamic state.
      required: [ok, player_state]
      properties:
        ok: { type: boolean, const: true }
        player_state: { $ref: '#/components/schemas/PlayerState' }
