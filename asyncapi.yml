asyncapi: '2.2.0'
info:
  title: Rural Game 2 Real-Time API
  version: '{{API_VERSION}}'
  description: |
    Real-time API for lobby management and game control in Rural Game 2.
    Socket.IO events for lobbies, players and turns.
    Client emits (publish) include Socket.IO acks documented via x-ack.

servers:
  production:
    url: ws://ruralgame.ddns.net{PREFIX}/game
    protocol: ws
    description: Production WebSocket server for the lobby and game namespace.
    variables:
      PREFIX:
        default: /api/v1
        description: API prefix (namespace root)
  local:
    url: ws://localhost:5000{PREFIX}/game
    protocol: ws
    description: Local development WebSocket server (Flask-SocketIO).
    variables:
      PREFIX:
        default: /api/v1
        description: API prefix (namespace root)

channels:
  create_lobby:
    description: Client requests to create a new lobby.
    publish:
      operationId: createLobby
      summary: Create a new lobby with the provided player information.
      message:
        $ref: '#/components/messages/CreateLobby'
      x-ack:
        oneOf:
          - $ref: '#/components/schemas/AckCreateLobbySuccess'
          - $ref: '#/components/schemas/AckError'

  join_lobby:
    description: Client requests to join a lobby.
    publish:
      operationId: joinLobby
      summary: Join an existing lobby by code.
      message:
        $ref: '#/components/messages/JoinLobby'
      x-ack:
        oneOf:
          - $ref: '#/components/schemas/AckJoinLobbySuccess'
          - $ref: '#/components/schemas/AckError'

  leave_lobby:
    description: Client requests to leave a lobby.
    publish:
      operationId: leaveLobby
      summary: Leave the specified lobby.
      message:
        $ref: '#/components/messages/LeaveLobby'
      x-ack:
        oneOf:
          - $ref: '#/components/schemas/AckLeaveLobbySuccess'
          - $ref: '#/components/schemas/AckError'

  start_game:
    description: Client requests to start the game for a lobby.
    publish:
      operationId: startGame
      summary: Start the game in the specified lobby.
      message:
        $ref: '#/components/messages/StartGame'
      x-ack:
        oneOf:
          - $ref: '#/components/schemas/AckOkOnly'
          - $ref: '#/components/schemas/AckError'

  update_player:
    description: Client requests to update their player information.
    publish:
      operationId: updatePlayer
      summary: Update player information in the lobby.
      message:
        $ref: '#/components/messages/UpdatePlayer'
      x-ack:
        oneOf:
          - $ref: '#/components/schemas/AckUpdatePlayerSuccess'
          - $ref: '#/components/schemas/AckError'

  update_profile_picture:
    description: Client requests to add, replace or remove a player's profile picture.
    publish:
      operationId: updateProfilePicture
      summary: Update a player's profile picture (send base64 or data URL; or remove it).
      message:
        $ref: '#/components/messages/UpdateProfilePicture'
      x-ack:
        oneOf:
          - $ref: '#/components/schemas/AckUpdateProfilePictureSuccess'
          - $ref: '#/components/schemas/AckError'

  get_user_info:
    description: Client requests to get their own player information.
    publish:
      operationId: getUserInfo
      summary: Retrieve the player's own information.
      message:
        $ref: '#/components/messages/GetUserInfo'
      x-ack:
        oneOf:
          - $ref: '#/components/schemas/AckGetUserInfoSuccess'
          - $ref: '#/components/schemas/AckError'

  next_turn:
    description: Client requests to progress to the next turn with a given turn type.
    publish:
      operationId: nextTurn
      summary: Progress to the next turn and trigger a new challenge broadcast.
      message:
        $ref: '#/components/messages/NextTurn'
      x-ack:
        description: |
          Ack varies by turn type:
            - secret_mission_type => { ok: true, challenge: {...}, player, turn_type }
            - other types => { ok: true }
        oneOf:
          - $ref: '#/components/schemas/AckOkOnly'
          - $ref: '#/components/schemas/AckNextTurnChallengeSuccess'
          - $ref: '#/components/schemas/AckError'

  choose_target:
    description: Client finalizes the target selection for a target challenge.
    publish:
      operationId: chooseTarget
      summary: Choose the participants (fills the description) for a target challenge.
      message:
        $ref: '#/components/messages/ChooseTarget'
      x-ack:
        oneOf:
          - $ref: '#/components/schemas/AckOkOnly'
          - $ref: '#/components/schemas/AckError'

  skip_turn:
    description: Client requests to skip the current challenge (if allowed) and apply punishment.
    publish:
      operationId: skipTurn
      summary: Skip the current turn (cannot skip secret missions).
      message:
        $ref: '#/components/messages/SkipOrCompleteTurn'
      x-ack:
        oneOf:
          - $ref: '#/components/schemas/AckOkOnly'
          - $ref: '#/components/schemas/AckError'

  complete_turn:
    description: Client confirms the challenge was completed.
    publish:
      operationId: completeTurn
      summary: Complete the current turn; may open a voting session.
      message:
        $ref: '#/components/messages/SkipOrCompleteTurn'
      x-ack:
        oneOf:
          - $ref: '#/components/schemas/AckOkOnly'
          - $ref: '#/components/schemas/AckCompleteTurnVoting'
          - $ref: '#/components/schemas/AckError'

  vote:
    description: Client submits a vote for the last performance if a voting session is open.
    publish:
      operationId: vote
      summary: Submit a 0..10 score. Performer cannot vote; each voter votes once.
      message:
        $ref: '#/components/messages/Vote'
      x-ack:
        oneOf:
          - $ref: '#/components/schemas/AckVoteProgress'
          - $ref: '#/components/schemas/AckVoteCompleted'
          - $ref: '#/components/schemas/AckError'

  # ---- Server to client notifications ----

  next_turn_type:
    description: Broadcast emitted right before computing the next challenge.
    subscribe:
      operationId: nextTurnType
      summary: Receive the next turn type to be processed.
      message:
        $ref: '#/components/messages/NextTurnType'

  following_turn:
    description: Broadcast with the next turn info. Payload depends on turn type.
    subscribe:
      operationId: followingTurn
      summary: Receive the upcoming turn data (type, player, and optionally challenge).
      message:
        oneOf:
          - $ref: '#/components/messages/FollowingTurnWithChallenge'
          - $ref: '#/components/messages/FollowingTurnWithoutChallenge'

  target_chosen:
    description: Broadcast after target selection is submitted.
    subscribe:
      operationId: targetChosen
      summary: Final target challenge description for the current performer.
      message:
        $ref: '#/components/messages/TargetChosen'

  turn_skipped:
    description: Broadcast when a turn is skipped and punishment is applied.
    subscribe:
      operationId: turnSkipped
      summary: Notifies the deduction applied to the performer.
      message:
        $ref: '#/components/messages/TurnSkipped'

  turn_completed_needs_voting:
    description: Broadcast when a completed turn requires voting.
    subscribe:
      operationId: turnCompletedNeedsVoting
      summary: Notifies the lobby to start voting for the performance.
      message:
        $ref: '#/components/messages/TurnCompletedNeedsVoting'

  vote_progress:
    description: Broadcast after each vote, showing who has voted so far.
    subscribe:
      operationId: voteProgress
      summary: Real-time voting progress (voter list, counts).
      message:
        $ref: '#/components/messages/VoteProgress'

  turn_completed:
    description: Broadcast when a turn completion is finalized (no voting or voting closed).
    subscribe:
      operationId: turnCompleted
      summary: Notifies the final score for the performer.
      message:
        $ref: '#/components/messages/TurnCompleted'

  player_joined:
    description: Notification sent when a player joins a lobby.
    subscribe:
      operationId: playerJoined
      summary: Receive information about the player that just joined.
      message:
        $ref: '#/components/messages/PlayerJoined'

  player_left:
    description: Notification sent when a player leaves a lobby.
    subscribe:
      operationId: playerLeft
      summary: Receive information about the player that just left.
      message:
        $ref: '#/components/messages/PlayerLeft'

  game_started:
    description: Notification sent when the game starts.
    subscribe:
      operationId: gameStarted
      summary: Receive the initial game state after the game has started.
      message:
        $ref: '#/components/messages/GameStarted'

  player_updated:
    description: Notification sent when a player updates their information.
    subscribe:
      operationId: playerUpdated
      summary: Receive updated player information after a player update.
      message:
        $ref: '#/components/messages/PlayerUpdated'

  profile_picture_updated:
    description: Notification sent when a player's profile picture is updated or removed.
    subscribe:
      operationId: profilePictureUpdated
      summary: Receive the new profile picture URL (or removal flag).
      message:
        $ref: '#/components/messages/ProfilePictureUpdated'

  error:
    description: Error notifications related to lobby or game operations.
    subscribe:
      operationId: error
      summary: Receive error messages for failed operations.
      message:
        $ref: '#/components/messages/Error'

components:
  messages:
    CreateLobby:
      name: CreateLobby
      title: Create Lobby
      summary: Message sent by the client to create a new lobby.
      payload:
        type: object
        required: [player]
        properties:
          player:
            $ref: '#/components/schemas/PlayerInfo'
        examples:
          - player:
              username: Alice
              drinking: true
              smoking: false
              partnered: true
              virgin: false
              gender: male

    JoinLobby:
      name: JoinLobby
      title: Join Lobby
      summary: Message sent by the client to join a lobby.
      payload:
        type: object
        required: [code, player]
        properties:
          code:
            $ref: '#/components/schemas/LobbyCode'
          player:
            $ref: '#/components/schemas/PlayerInfo'
        examples:
          - code: '1234'
            player:
              username: Bob
              drinking: false
              smoking: false
              partnered: false
              virgin: true
              gender: female

    LeaveLobby:
      name: LeaveLobby
      title: Leave Lobby
      summary: Message sent by the client to leave a lobby.
      payload:
        type: object
        required: [code, player_name]
        properties:
          code:
            $ref: '#/components/schemas/LobbyCode'
          player_name:
            type: string
            description: Username of the player leaving.
        examples:
          - code: '1234'
            player_name: Bob

    StartGame:
      name: StartGame
      title: Start Game
      summary: Message sent by the client to initiate the game in a lobby.
      payload:
        type: object
        required: [code, player_name]
        properties:
          code:
            $ref: '#/components/schemas/LobbyCode'
          player_name:
            type: string
            description: Host username who is starting the game.
        examples:
          - code: '1234'
            player_name: Alice

    UpdatePlayer:
      name: UpdatePlayer
      title: Update Player
      summary: Message sent by the client to update their player information.
      payload:
        type: object
        required: [code, current_username]
        properties:
          code:
            $ref: '#/components/schemas/LobbyCode'
          current_username:
            type: string
          new_username:
            type: string
          drinking:
            type: boolean
          smoking:
            type: boolean
          partnered:
            type: boolean
          virgin:
            type: boolean
          gender:
            $ref: '#/components/schemas/GenderEnum'
        examples:
          - code: '1234'
            current_username: Bob
            new_username: Bobby
            smoking: true

    UpdateProfilePicture:
      name: UpdateProfilePicture
      title: Update Profile Picture
      summary: Add/replace/remove a player's profile picture in a lobby.
      payload:
        $ref: '#/components/schemas/UpdateProfilePicturePayload'

    GetUserInfo:
      name: GetUserInfo
      title: Get User Info
      summary: Message sent by the client to retrieve their own player information.
      payload:
        type: object
        required: [code, player_name]
        properties:
          code:
            $ref: '#/components/schemas/LobbyCode'
          player_name:
            type: string
        examples:
          - code: '1234'
            player_name: Alice

    NextTurn:
      name: NextTurn
      title: Next Turn
      summary: Client requests to advance the turn and generate a challenge of the specified type.
      payload:
        type: object
        required: [code, turn_type]
        properties:
          code:
            $ref: '#/components/schemas/LobbyCode'
          turn_type:
            $ref: '#/components/schemas/TurnTypeEnum'
        examples:
          - code: '1234'
            turn_type: challenge_type

    NextTurnType:
      name: NextTurnType
      title: Next Turn Type
      summary: Broadcast announcing the next turn type.
      payload:
        type: object
        required: [turn_type]
        properties:
          turn_type: { $ref: '#/components/schemas/TurnTypeEnum' }
        examples:
          - turn_type: group_challenge_type

    FollowingTurnWithChallenge:
      name: FollowingTurnWithChallenge
      title: Following Turn (with challenge)
      summary: Broadcast for challenge/group_challenge/target_challenge turns.
      payload:
        type: object
        required: [turn_type, challenge, player]
        properties:
          turn_type: { $ref: '#/components/schemas/TurnTypeEnum' }
          challenge: { $ref: '#/components/schemas/Challenge' }
          player: { type: string }
        examples:
          - turn_type: challenge_type
            player: Alice
            challenge:
              title: 'Balance Shot'
              description: 'Alice vs {P1:gender=female} do a balance contest.'
              icon: 'https://example.com/icon.png'

    FollowingTurnWithoutChallenge:
      name: FollowingTurnWithoutChallenge
      title: Following Turn (without challenge)
      summary: Broadcast for secret_mission turns.
      payload:
        type: object
        required: [turn_type, player]
        properties:
          turn_type: { $ref: '#/components/schemas/TurnTypeEnum' }
          player: { type: string }
        examples:
          - turn_type: secret_mission_type
            player: Bob

    ChooseTarget:
      name: ChooseTarget
      title: Choose Target
      summary: Client submits the resolved description for a target challenge.
      payload:
        type: object
        required: [code, description]
        properties:
          code: { $ref: '#/components/schemas/LobbyCode' }
          description:
            type: string
            description: Finalized description with chosen targets.
        examples:
          - code: '1234'
            description: 'Kiss {Alice} or {Carol}'

    TargetChosen:
      name: TargetChosen
      title: Target Chosen
      summary: Broadcast confirming the final description for the target challenge.
      payload:
        type: object
        required: [turn_type, description, player]
        properties:
          turn_type: { $ref: '#/components/schemas/TurnTypeEnum' }
          description: { type: string }
          player: { type: string }
        examples:
          - turn_type: target_challenge_type
            player: Alice
            description: 'Kiss Bob and Carol'

    SkipOrCompleteTurn:
      name: SkipOrCompleteTurn
      title: Skip/Complete Turn
      summary: Client requests to skip or complete a challenge.
      payload:
        type: object
        required: [code, player_name, turn_type, title]
        properties:
          code: { $ref: '#/components/schemas/LobbyCode' }
          player_name: { type: string }
          turn_type: { $ref: '#/components/schemas/TurnTypeEnum' }
          title:
            type: string
            description: Challenge title
        examples:
          - code: '1234'
            player_name: Alice
            turn_type: challenge_type
            title: 'Balance Shot'

    TurnSkipped:
      name: TurnSkipped
      title: Turn Skipped
      summary: Broadcast that a turn was skipped and points were deducted.
      payload:
        type: object
        required: [player, turn_type, title, new_score]
        properties:
          player: { type: string }
          turn_type: { $ref: '#/components/schemas/TurnTypeEnum' }
          title: { type: string }
          new_score: { type: integer }
        examples:
          - player: Alice
            turn_type: group_challenge_type
            title: 'Dance Off'
            new_score: 18

    TurnCompletedNeedsVoting:
      name: TurnCompletedNeedsVoting
      title: Turn Completed (needs voting)
      summary: Broadcast to start voting for a performance.
      payload:
        type: object
        required: [player, turn_type, title, potential_prize]
        properties:
          player: { type: string }
          turn_type: { $ref: '#/components/schemas/TurnTypeEnum' }
          title: { type: string }
          potential_prize: { type: integer }
        examples:
          - player: Bob
            turn_type: challenge_type
            title: 'Balance Shot'
            potential_prize: 10

    Vote:
      name: Vote
      title: Vote
      summary: Client submits a vote (0..10) for the last performance.
      payload:
        type: object
        required: [code, player_name, vote]
        properties:
          code: { $ref: '#/components/schemas/LobbyCode' }
          player_name:
            type: string
            description: Voter username
          vote:
            type: integer
            minimum: 0
            maximum: 10
        examples:
          - code: '1234'
            player_name: Carol
            vote: 8

    VoteProgress:
      name: VoteProgress
      title: Vote Progress
      summary: Broadcast after each vote, includes voter list and counts.
      payload:
        type: object
        required: [turn_type, title, player, voter, voters, received, remaining]
        properties:
          turn_type: { $ref: '#/components/schemas/TurnTypeEnum' }
          title: { type: string }
          player:
            type: string
            description: Performer username
          voter:
            type: string
            description: Username of the user who just voted
          voters:
            type: array
            items: { type: string }
          received: { type: integer }
          remaining: { type: integer }
        examples:
          - turn_type: challenge_type
            title: 'Balance Shot'
            player: Alice
            voter: Carol
            voters: [Carol]
            received: 1
            remaining: 2

    TurnCompleted:
      name: TurnCompleted
      title: Turn Completed
      summary: Broadcast when a turn is finalized (no voting or voting closed).
      payload:
        type: object
        required: [player, turn_type, title, new_score]
        properties:
          player: { type: string }
          turn_type: { $ref: '#/components/schemas/TurnTypeEnum' }
          title: { type: string }
          new_score: { type: integer }
        examples:
          - player: Alice
            turn_type: challenge_type
            title: 'Balance Shot'
            new_score: 28

    PlayerJoined:
      name: PlayerJoined
      title: Player Joined
      summary: Notification that a new player has joined a lobby.
      payload:
        type: object
        required: [player]
        properties:
          player:
            type: string
          profile_picture_url:
            type: string
            format: uri
            nullable: true
        examples:
          - player: Bob
            profile_picture_url: 'https://example.com/p.png'

    PlayerLeft:
      name: PlayerLeft
      title: Player Left
      summary: Notification that a player has left a lobby.
      payload:
        type: object
        required: [player, host]
        properties:
          player: { type: string }
          host:
            type: string
            nullable: true
        examples:
          - player: Bob
            host: Alice

    GameStarted:
      name: GameStarted
      title: Game Started
      summary: Notification that the game has started and includes the full game state.
      payload:
        $ref: '#/components/schemas/GameState'

    PlayerUpdated:
      name: PlayerUpdated
      title: Player Updated
      summary: Notification that a player has updated their information.
      payload:
        type: object
        required: [old_username, new_username]
        properties:
          old_username: { type: string }
          new_username: { type: string }
          profile_picture_url:
            type: string
            format: uri
            nullable: true
        examples:
          - old_username: Bob
            new_username: Bobby
            profile_picture_url: 'https://example.com/p2.png'

    ProfilePictureUpdated:
      name: ProfilePictureUpdated
      title: Profile Picture Updated
      summary: Notification that a player's profile picture has changed or was removed.
      payload:
        type: object
        required: [player, removed]
        properties:
          player: { type: string }
          profile_picture_url:
            type: string
            format: uri
            nullable: true
          removed: { type: boolean }
        examples:
          - player: Alice
            profile_picture_url: 'https://example.com/p3.png'
            removed: false

    Error:
      name: Error
      title: Error
      summary: Error message emitted by the server when an operation fails.
      payload:
        type: object
        properties:
          message:
            type: string
            description: Human-readable error message.
        examples:
          - message: 'Player already in lobby'

  schemas:
    # -----------------------
    # Common primitives/enums
    # -----------------------
    LobbyCode:
      type: string
      description: Unique 4-digit lobby code.
      pattern: '^[0-9]{4}$'

    GenderEnum:
      type: string
      description: Gender of the player.
      enum: [male, female]

    TurnTypeEnum:
      type: string
      description: Type of turn to progress to.
      enum: [challenge_type, group_challenge_type, secret_mission_type, target_challenge_type]

    # -----------------------
    # Domain models
    # -----------------------
    PlayerInfo:
      type: object
      required: [username, drinking, smoking, partnered, virgin, gender]
      properties:
        username: { type: string }
        drinking: { type: boolean }
        smoking: { type: boolean }
        partnered: { type: boolean }
        virgin: { type: boolean }
        gender: { $ref: '#/components/schemas/GenderEnum' }
        profile_pic:
          type: string
          nullable: true
          description: Optional identifier/relative path used internally.

    PlayerState:
      type: object
      required: [username, points, secret_missions, connected]
      properties:
        username: { type: string }
        points: { type: integer }
        role:
          type: string
          nullable: true
        secret_missions:
          type: array
          items: { type: string }
        connected: { type: boolean }

    ConnectedPlayer:
      type: object
      required: [username]
      properties:
        username: { type: string }
        profile_picture_url:
          type: string
          format: uri
          nullable: true

    GameState:
      type: object
      description: Full state of a lobby including lobby metadata, players, order and restrictions.
      properties:
        lobby:
          type: object
        players:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/PlayerState'
        order:
          type: array
          items: { type: string }
        restrictions:
          type: object
          properties:
            males: { type: integer, minimum: 0 }
            females: { type: integer, minimum: 0 }

    Challenge:
      type: object
      description: Generic challenge payload enriched by backend (includes icon URL).
      properties:
        title: { type: string }
        description: { type: string, nullable: true }
        males: { type: integer, nullable: true }
        females: { type: integer, nullable: true }
        icon:
          type: string
          format: uri

    UpdateProfilePicturePayload:
      type: object
      description: Update or remove a player's profile picture.
      required: [code, player_name]
      properties:
        code: { $ref: '#/components/schemas/LobbyCode' }
        player_name: { type: string }
        remove:
          type: boolean
          default: false
        data_url:
          type: string
          pattern: '^data:image\/[A-Za-z0-9]+;base64,.+'
        image_base64: { type: string }
        extension:
          type: string
          enum: [png, jpg, jpeg, gif]
        filename: { type: string }
      anyOf:
        - properties: { remove: { const: true } }
          required: [code, player_name, remove]
        - anyOf:
            - required: [code, player_name, data_url]
            - required: [code, player_name, image_base64, extension]

    # -----------------------
    # Ack payloads (Socket.IO)
    # -----------------------
    AckError:
      type: object
      required: [ok, error]
      properties:
        ok: { type: boolean, const: false }
        error: { type: string }

    AckOkOnly:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean, const: true }

    AckCreateLobbySuccess:
      type: object
      required: [ok, code, connected_players]
      properties:
        ok: { type: boolean, const: true }
        code: { $ref: '#/components/schemas/LobbyCode' }
        connected_players:
          type: array
          items: { $ref: '#/components/schemas/ConnectedPlayer' }

    AckJoinLobbySuccess:
      type: object
      required: [connected_players]
      properties:
        connected_players:
          type: array
          items: { $ref: '#/components/schemas/ConnectedPlayer' }

    AckLeaveLobbySuccess:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean, const: true }
        host:
          type: string
          nullable: true
          description: New host username, or null if lobby was removed.

    AckUpdatePlayerSuccess:
      type: object
      required: [ok, player, profile_picture_url]
      properties:
        ok: { type: boolean, const: true }
        player: { type: string }
        profile_picture_url:
          type: string
          format: uri

    AckGetUserInfoSuccess:
      type: object
      required: [ok, player_info]
      properties:
        ok: { type: boolean, const: true }
        player_info:
          type: object
          required: [username, drinking, smoking, partnered, virgin, gender, profile_picture_url]
          properties:
            username: { type: string }
            drinking: { type: boolean }
            smoking: { type: boolean }
            partnered: { type: boolean }
            virgin: { type: boolean }
            gender: { $ref: '#/components/schemas/GenderEnum' }
            profile_picture_url:
              type: string
              format: uri

    AckUpdateProfilePictureSuccess:
      type: object
      required: [ok, player, profile_picture_url, removed]
      properties:
        ok: { type: boolean, const: true }
        player: { type: string }
        profile_picture_url:
          type: string
          format: uri
        removed: { type: boolean }

    AckNextTurnChallengeSuccess:
      type: object
      description: Returned only for secret_mission_type.
      required: [ok, challenge, player, turn_type]
      properties:
        ok: { type: boolean, const: true }
        player: { type: string }
        turn_type: { $ref: '#/components/schemas/TurnTypeEnum' }
        challenge: { $ref: '#/components/schemas/Challenge' }

    AckCompleteTurnVoting:
      type: object
      description: Returned when a voting session is opened for the completed turn.
      required: [ok, potential_prize, voting]
      properties:
        ok: { type: boolean, const: true }
        potential_prize: { type: integer }
        voting: { type: boolean, const: true }

    AckVoteProgress:
      type: object
      description: Returned after a vote when voting is still in progress.
      required: [ok, completed, received, remaining]
      properties:
        ok: { type: boolean, const: true }
        completed: { type: boolean, const: false }
        received: { type: integer }
        remaining: { type: integer }
        voters:
          type: array
          items: { type: string }

    AckVoteCompleted:
      type: object
      description: Returned when the voting session closes and score is applied.
      required: [ok, completed, player, average_vote, awarded, new_score, votes]
      properties:
        ok: { type: boolean, const: true }
        completed: { type: boolean, const: true }
        player: { type: string }
        average_vote: { type: number }
        awarded: { type: integer }
        new_score: { type: integer }
        votes: { type: integer }
        voters:
          type: array
          items: { type: string }
