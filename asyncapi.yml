asyncapi: '2.2.0'
info:
  title: Rural Game 2 Real-Time API
  version: '{{API_VERSION}}'
  description: |
    Real-time API for lobby management and game control in Rural Game 2.
    Socket.IO events for lobbies, players, turns, voting and team selection.
    Client emits (publish) include Socket.IO acks documented via x-ack.

servers:
  production:
    url: ws://ruralgame.ddns.net{PREFIX}/game
    protocol: ws
    description: Production WebSocket server for the lobby and game namespace.
    variables:
      PREFIX:
        default: /api/v1
        description: API prefix (namespace root)
  local:
    url: ws://localhost:5000{PREFIX}/game
    protocol: ws
    description: Local development WebSocket server (Flask-SocketIO).
    variables:
      PREFIX:
        default: /api/v1
        description: API prefix (namespace root)

channels:
  create_lobby:
    description: Client requests to create a new lobby.
    publish:
      operationId: createLobby
      summary: Create a new lobby with the provided player information.
      message:
        $ref: '#/components/messages/CreateLobby'
      x-ack:
        oneOf:
          - $ref: '#/components/schemas/AckCreateLobbySuccess'
          - $ref: '#/components/schemas/AckError'

  join_lobby:
    description: Client requests to join a lobby.
    publish:
      operationId: joinLobby
      summary: Join an existing lobby by code.
      message:
        $ref: '#/components/messages/JoinLobby'
      x-ack:
        oneOf:
          - $ref: '#/components/schemas/AckJoinLobbySuccess'
          - $ref: '#/components/schemas/AckError'

  leave_lobby:
    description: Client requests to leave a lobby.
    publish:
      operationId: leaveLobby
      summary: Leave the specified lobby.
      message:
        $ref: '#/components/messages/LeaveLobby'
      x-ack:
        oneOf:
          - $ref: '#/components/schemas/AckLeaveLobbySuccess'
          - $ref: '#/components/schemas/AckError'

  start_game:
    description: Client requests to start the game for a lobby.
    publish:
      operationId: startGame
      summary: Start the game in the specified lobby.
      message:
        $ref: '#/components/messages/StartGame'
      x-ack:
        oneOf:
          - $ref: '#/components/schemas/AckOkOnly'
          - $ref: '#/components/schemas/AckError'

  update_player:
    description: Client requests to update their player information.
    publish:
      operationId: updatePlayer
      summary: Update player information in the lobby.
      message:
        $ref: '#/components/messages/UpdatePlayer'
      x-ack:
        oneOf:
          - $ref: '#/components/schemas/AckUpdatePlayerSuccess'
          - $ref: '#/components/schemas/AckError'

  update_profile_picture:
    description: Client requests to add, replace or remove a player's profile picture.
    publish:
      operationId: updateProfilePicture
      summary: Update a player's profile picture (send base64 or data URL; or remove it).
      message:
        $ref: '#/components/messages/UpdateProfilePicture'
      x-ack:
        oneOf:
          - $ref: '#/components/schemas/AckUpdateProfilePictureSuccess'
          - $ref: '#/components/schemas/AckError'

  get_user_info:
    description: Client requests to get their own player information.
    publish:
      operationId: getUserInfo
      summary: Retrieve the player's own information.
      message:
        $ref: '#/components/messages/GetUserInfo'
      x-ack:
        oneOf:
          - $ref: '#/components/schemas/AckGetUserInfoSuccess'
          - $ref: '#/components/schemas/AckError'

  get_player_state:
    description: Client requests to get a player's dynamic state (points, role, missions, connected).
    publish:
      operationId: getPlayerState
      summary: Retrieve dynamic PlayerState for a player in a lobby.
      message:
        $ref: '#/components/messages/GetPlayerState'
      x-ack:
        oneOf:
          - $ref: '#/components/schemas/AckGetPlayerStateSuccess'
          - $ref: '#/components/schemas/AckError'

  give_points:
    description: Client requests to add/subtract points for a player.
    publish:
      operationId: givePoints
      summary: Add (positive) or subtract (negative) points to a player's score.
      message:
        $ref: '#/components/messages/GivePoints'
      x-ack:
        oneOf:
          - $ref: '#/components/schemas/AckOkOnly'
          - $ref: '#/components/schemas/AckError'

  next_turn:
    description: Client requests to progress to the next turn with a given turn type.
    publish:
      operationId: nextTurn
      summary: Progress to the next turn and trigger a new challenge broadcast.
      message:
        $ref: '#/components/messages/NextTurn'
      x-ack:
        description: |
          Ack varies by turn type:
            - challenge, group_challenge => { ok: true }
            - secret_mission, target_challenge => { ok: true, challenge: {...}, player, turn_type }
        oneOf:
          - $ref: '#/components/schemas/AckOkOnly'
          - $ref: '#/components/schemas/AckNextTurnChallengeSuccess'
          - $ref: '#/components/schemas/AckError'

  choose_target:
    description: Client selects actual participants for the current target challenge (non-random).
    publish:
      operationId: chooseTarget
      summary: Choose concrete usernames for the candidate slots in a target challenge.
      message:
        $ref: '#/components/messages/ChooseTarget'
      x-ack:
        oneOf:
          - $ref: '#/components/schemas/AckOkOnly'
          - $ref: '#/components/schemas/AckError'

  skip_turn:
    description: Client requests to skip the current challenge (if skippable).
    publish:
      operationId: skipTurn
      summary: Skip current challenge; applies penalty to the skipping player.
      message:
        $ref: '#/components/messages/SkipOrComplete'
      x-ack:
        oneOf:
          - $ref: '#/components/schemas/AckOkOnly'
          - $ref: '#/components/schemas/AckError'

  complete_turn:
    description: Client marks the current challenge as completed.
    publish:
      operationId: completeTurn
      summary: Complete the challenge; returns prize or triggers performance voting.
      message:
        $ref: '#/components/messages/SkipOrComplete'
      x-ack:
        oneOf:
          - $ref: '#/components/schemas/AckCompleteTurnNeedsVoting'
          - $ref: '#/components/schemas/AckOkOnly'
          - $ref: '#/components/schemas/AckError'

  vote:
    description: |
      Client votes a performance from 0..10.  
      **Dictator role counts as double** (equivalent to submitting two identical votes), but storage keeps one record per voter; the double weight is only applied in the tally.
      Eligible voters: whole lobby except participants, unless everyone participates (then everyone votes).
    publish:
      operationId: vote
      summary: Submit a performance vote (0..10).
      message:
        $ref: '#/components/messages/Vote'
      x-ack:
        description: |
          Returns `{ ok: true }` while voting is still open, or the final average & award when voting closes.
        oneOf:
          - $ref: '#/components/schemas/AckOkOnly'
          - $ref: '#/components/schemas/AckVoteFinished'
          - $ref: '#/components/schemas/AckError'

  team_vote:
    description: |
      Client votes for the winning team (`Team0`, `Team1`, ...).  
      **Dictator role counts as double** (adds +2 to the chosen team).  
      Eligible voters: whole lobby except participants, unless everyone participates.
    publish:
      operationId: teamVote
      summary: Submit a team vote.
      message:
        $ref: '#/components/messages/TeamVote'
      x-ack:
        description: |
          Returns `{ ok: true }` while voting is still open, or the final winner when voting closes.
        oneOf:
          - $ref: '#/components/schemas/AckOkOnly'
          - $ref: '#/components/schemas/AckTeamVoteFinished'
          - $ref: '#/components/schemas/AckError'

  # -------------------------
  # Extra client -> server queries
  # -------------------------
  get_role_info:
    description: Client requests their current role info (rendered description) including a role picture URL.
    publish:
      operationId: getRoleInfo
      summary: Retrieve role title, description and picture URL.
      message:
        $ref: '#/components/messages/GetRoleInfo'
      x-ack:
        oneOf:
          - $ref: '#/components/schemas/AckGetRoleInfoSuccess'
          - $ref: '#/components/schemas/AckError'

  get_player_secret_missions:
    description: Client requests their pending secret missions including picture URLs.
    publish:
      operationId: getPlayerSecretMissions
      summary: Retrieve pending secret missions (title, description, prize, punishment, picture_url).
      message:
        $ref: '#/components/messages/GetPlayerSecretMissions'
      x-ack:
        oneOf:
          - $ref: '#/components/schemas/AckGetPlayerSecretMissionsSuccess'
          - $ref: '#/components/schemas/AckError'

  # -------------------------
  # Server -> client messages
  # -------------------------
  player_joined:
    description: Notification sent when a player joins a lobby.
    subscribe:
      operationId: playerJoined
      summary: Receive information about the player that just joined.
      message:
        $ref: '#/components/messages/PlayerJoined'

  player_left:
    description: Notification sent when a player leaves a lobby.
    subscribe:
      operationId: playerLeft
      summary: Receive information about the player that just left.
      message:
        $ref: '#/components/messages/PlayerLeft'

  game_started:
    description: Notification sent when the game starts.
    subscribe:
      operationId: gameStarted
      summary: Receive the initial game state after the game has started.
      message:
        $ref: '#/components/messages/GameStarted'

  player_updated:
    description: Notification sent when a player updates their information.
    subscribe:
      operationId: playerUpdated
      summary: Receive updated player information after a player update.
      message:
        $ref: '#/components/messages/PlayerUpdated'

  profile_picture_updated:
    description: Notification sent when a player's profile picture is updated or removed.
    subscribe:
      operationId: profilePictureUpdated
      summary: Receive the new profile picture URL (or removal flag).
      message:
        $ref: '#/components/messages/ProfilePictureUpdated'

  next_turn_type:
    description: Pre-announcement of the upcoming turn type, emitted as soon as it is decided (before `following_turn`).
    subscribe:
      operationId: nextTurnType
      summary: Receive the upcoming turn type and the current turn player.
      message:
        $ref: '#/components/messages/NextTurnType'

  following_turn:
    description: Broadcast with the next turn info. Always includes participants; for team challenges includes `teams`.
    subscribe:
      operationId: followingTurn
      summary: Receive the upcoming turn data (type, player, participants and optionally teams/challenge).
      message:
        oneOf:
          - $ref: '#/components/messages/FollowingTurnWithChallenge'
          - $ref: '#/components/messages/FollowingTurnWithoutChallenge'

  target_chosen:
    description: Broadcast after client chooses concrete participants for a target challenge.
    subscribe:
      operationId: targetChosen
      summary: Receive the final assignment for target challenge participants.
      message:
        $ref: '#/components/messages/TargetChosen'

  team_vote_started:
    description: Broadcast when a team vote session is opened.
    subscribe:
      operationId: teamVoteStarted
      summary: Receive teams and expected number of voters.
      message:
        $ref: '#/components/messages/TeamVoteStarted'

  turn_skipped:
    description: Broadcast when a turn is skipped.
    subscribe:
      operationId: turnSkipped
      summary: Receive info about the skipping player and new score.
      message:
        $ref: '#/components/messages/TurnSkipped'

  turn_completed_needs_voting:
    description: Broadcast when a completed turn requires performance voting.
    subscribe:
      operationId: turnCompletedNeedsVoting
      summary: Receive info to start performance voting.
      message:
        $ref: '#/components/messages/TurnCompletedNeedsVoting'

  turn_completed:
    description: Broadcast when a completed turn gives immediate points (no voting).
    subscribe:
      operationId: turnCompleted
      summary: Receive awarded points and new score.
      message:
        $ref: '#/components/messages/TurnCompleted'

  vote_progress:
    description: Broadcast progress of performance votes (who already voted).
    subscribe:
      operationId: voteProgress
      summary: Receive the list of voters that already voted for performance.
      message:
        $ref: '#/components/messages/VoteProgress'

  vote_finished:
    description: Broadcast after performance voting is closed and award assigned.
    subscribe:
      operationId: voteFinished
      summary: Receive weighted average, award points and new performer score.
      message:
        $ref: '#/components/messages/VoteFinished'

  team_vote_progress:
    description: Broadcast progress of team votes (who voted + current weighted counts).
    subscribe:
      operationId: teamVoteProgress
      summary: Receive current team vote tally and voters list.
      message:
        $ref: '#/components/messages/TeamVoteProgress'

  team_vote_finished:
    description: Broadcast when team voting is closed and a winner team is decided.
    subscribe:
      operationId: teamVoteFinished
      summary: Receive the winning team and final weighted counts.
      message:
        $ref: '#/components/messages/TeamVoteFinished'

  points_given:
    description: Broadcast when points are added/subtracted to a player.
    subscribe:
      operationId: pointsGiven
      summary: Receive the receiver, delta points and their new score.
      message:
        $ref: '#/components/messages/PointsGiven'

  game_finished:
    description: Broadcast when a player reaches the configured points_to_win. Emitted before the lobby is closed.
    subscribe:
      operationId: gameFinished
      summary: Receive winner info and target points; lobby will be closed right after.
      message:
        $ref: '#/components/messages/GameFinished'

  lobby_closed:
    description: Broadcast when the lobby state has been cleaned up after a game finishes.
    subscribe:
      operationId: lobbyClosed
      summary: Receive confirmation that the lobby has been removed.
      message:
        $ref: '#/components/messages/LobbyClosed'

  error:
    description: Error notifications related to lobby or game operations.
    subscribe:
      operationId: error
      summary: Receive error messages for failed operations.
      message:
        $ref: '#/components/messages/Error'

components:
  messages:
    CreateLobby:
      name: CreateLobby
      title: Create Lobby
      summary: Message sent by the client to create a new lobby.
      payload:
        type: object
        required: [player]
        properties:
          player:
            $ref: '#/components/schemas/PlayerInfo'
          points_to_win:
            type: integer
            minimum: 1
            description: Optional target points to automatically finish the game.
      examples:
        - payload:
            player:
              username: Alice
              drinking: true
              smoking: false
              partnered: false
              virgin: false
              gender: male
            points_to_win: 1000

    JoinLobby:
      name: JoinLobby
      title: Join Lobby
      summary: Message sent by the client to join a lobby.
      payload:
        type: object
        required: [code, player]
        properties:
          code: { $ref: '#/components/schemas/LobbyCode' }
          player: { $ref: '#/components/schemas/PlayerInfo' }

    LeaveLobby:
      name: LeaveLobby
      title: Leave Lobby
      summary: Message sent by the client to leave a lobby.
      payload:
        type: object
        required: [code, player_name]
        properties:
          code: { $ref: '#/components/schemas/LobbyCode' }
          player_name:
            type: string
            description: Username of the player leaving.

    StartGame:
      name: StartGame
      title: Start Game
      summary: Message sent by the client to initiate the game in a lobby.
      payload:
        type: object
        required: [code, player_name]
        properties:
          code: { $ref: '#/components/schemas/LobbyCode' }
          player_name:
            type: string
            description: Host username who is starting the game.

    UpdatePlayer:
      name: UpdatePlayer
      title: Update Player
      summary: Message sent by the client to update their player information.
      payload:
        type: object
        required: [code, current_username]
        properties:
          code: { $ref: '#/components/schemas/LobbyCode' }
          current_username: { type: string }
          new_username: { type: string }
          drinking: { type: boolean }
          smoking: { type: boolean }
          partnered: { type: boolean }
          virgin: { type: boolean }
          gender: { $ref: '#/components/schemas/GenderEnum' }

    UpdateProfilePicture:
      name: UpdateProfilePicture
      title: Update Profile Picture
      summary: Add/replace/remove a player's profile picture in a lobby.
      payload:
        $ref: '#/components/schemas/UpdateProfilePicturePayload'

    GetUserInfo:
      name: GetUserInfo
      title: Get User Info
      summary: Message sent by the client to retrieve their own player information.
      payload:
        type: object
        required: [code, player_name]
        properties:
          code: { $ref: '#/components/schemas/LobbyCode' }
          player_name: { type: string }

    GetPlayerState:
      name: GetPlayerState
      title: Get Player State
      summary: Retrieve PlayerState (points, role, missions, connected).
      payload:
        type: object
        required: [code, player_name]
        properties:
          code: { $ref: '#/components/schemas/LobbyCode' }
          player_name: { type: string }

    GivePoints:
      name: GivePoints
      title: Give Points
      summary: Add or subtract points to a player's score.
      payload:
        type: object
        required: [code, player_name, points]
        properties:
          code: { $ref: '#/components/schemas/LobbyCode' }
          player_name: { type: string }
          points:
            type: integer
            description: Positive to add, negative to subtract.

    NextTurn:
      name: NextTurn
      title: Next Turn
      summary: Client requests to advance the turn and generate a challenge of the specified type.
      payload:
        type: object
        required: [code, turn_type]
        properties:
          code: { $ref: '#/components/schemas/LobbyCode' }
          turn_type: { $ref: '#/components/schemas/TurnTypeEnum' }

    ChooseTarget:
      name: ChooseTarget
      title: Choose Target
      summary: Provide final usernames for candidate slots in target challenges.
      payload:
        type: object
        required: [code, description]
        properties:
          code: { $ref: '#/components/schemas/LobbyCode' }
          description:
            type: string
            description: Final description text with chosen usernames (e.g. "{Alice} vs {Bob}").

    SkipOrComplete:
      name: SkipOrComplete
      title: Skip or Complete
      summary: Skip or complete a challenge.
      payload:
        type: object
        required: [code, player_name, turn_type, title]
        properties:
          code: { $ref: '#/components/schemas/LobbyCode' }
          player_name: { type: string }
          turn_type: { $ref: '#/components/schemas/TurnTypeEnum' }
          title: { type: string }

    Vote:
      name: Vote
      title: Vote Performance
      summary: Submit a performance vote (0..10). Dictator counts as double in tally.
      payload:
        type: object
        required: [code, player_name, vote]
        properties:
          code: { $ref: '#/components/schemas/LobbyCode' }
          player_name: { type: string }
          vote:
            type: integer
            minimum: 0
            maximum: 10
      examples:
        - payload:
            code: "1234"
            player_name: "Bob"
            vote: 7

    TeamVote:
      name: TeamVote
      title: Vote Team
      summary: Vote the winning team (e.g., Team0, Team1). Dictator adds +2 to the chosen team.
      payload:
        type: object
        required: [code, player_name, team]
        properties:
          code: { $ref: '#/components/schemas/LobbyCode' }
          player_name: { type: string }
          team:
            type: string
            pattern: '^Team[0-9]+$'
      examples:
        - payload:
            code: "1234"
            player_name: "Carol"
            team: "Team1"

    GetRoleInfo:
      name: GetRoleInfo
      title: Get Role Info
      summary: Retrieve current role info for a player.
      payload:
        type: object
        required: [code, player_name]
        properties:
          code: { $ref: '#/components/schemas/LobbyCode' }
          player_name: { type: string }

    GetPlayerSecretMissions:
      name: GetPlayerSecretMissions
      title: Get Player Secret Missions
      summary: Retrieve pending secret missions for a player.
      payload:
        type: object
        required: [code, player_name]
        properties:
          code: { $ref: '#/components/schemas/LobbyCode' }
          player_name: { type: string }

    PlayerJoined:
      name: PlayerJoined
      title: Player Joined
      summary: Notification that a new player has joined a lobby.
      payload:
        type: object
        required: [player]
        properties:
          player: { type: string }
          profile_picture_url:
            type: string
            format: uri
            nullable: true

    PlayerLeft:
      name: PlayerLeft
      title: Player Left
      summary: Notification that a player has left a lobby.
      payload:
        type: object
        required: [player, host]
        properties:
          player: { type: string }
          host:
            type: string
            nullable: true

    GameStarted:
      name: GameStarted
      title: Game Started
      summary: Notification that the game has started and includes the full game state.
      payload:
        $ref: '#/components/schemas/GameState'

    PlayerUpdated:
      name: PlayerUpdated
      title: Player Updated
      summary: Notification that a player has updated their information.
      payload:
        type: object
        required: [old_username, new_username]
        properties:
          old_username: { type: string }
          new_username: { type: string }
          profile_picture_url:
            type: string
            format: uri
            nullable: true

    ProfilePictureUpdated:
      name: ProfilePictureUpdated
      title: Profile Picture Updated
      summary: Notification that a player's profile picture has changed or was removed.
      payload:
        type: object
        required: [player, removed]
        properties:
          player: { type: string }
          profile_picture_url:
            type: string
            format: uri
            nullable: true
          removed: { type: boolean }

    NextTurnType:
      name: NextTurnType
      title: Next Turn Type
      summary: Pre-announcement of the upcoming turn type; full data will arrive in `following_turn`.
      payload:
        type: object
        required: [turn_type, player]
        properties:
          turn_type: { $ref: '#/components/schemas/TurnTypeEnum' }
          player: { type: string }
      examples:
        - payload:
            turn_type: group_challenge_type
            player: Alice

    FollowingTurnWithChallenge:
      name: FollowingTurnWithChallenge
      title: Following Turn (with challenge)
      summary: Broadcast for challenge/group_challenge turns. Always includes participants; `teams` present when teams are defined.
      payload:
        type: object
        required: [turn_type, challenge, player, participants]
        properties:
          turn_type: { $ref: '#/components/schemas/TurnTypeEnum' }
          challenge: { $ref: '#/components/schemas/Challenge' }
          player: { type: string }
          participants:
            type: array
            items: { type: string }
          teams:
            type: array
            items: { $ref: '#/components/schemas/Team' }
            nullable: true
      examples:
        - payload:
            turn_type: group_challenge_type
            player: Alice
            participants: [Alice, Bob, Carol, Dave]
            teams:
              - name: Team0
                members: [Alice, Bob]
              - name: Team1
                members: [Carol, Dave]
            challenge:
              title: "Flip Cup"
              description: "Team battle!"
              group_challenge: true
              prize: 100
              voting: true
              icon: "https://.../icon.png"

    FollowingTurnWithoutChallenge:
      name: FollowingTurnWithoutChallenge
      title: Following Turn (without challenge)
      summary: Broadcast for secret_mission/target_challenge turns. Always includes participants (may be empty) and optionally team slots metadata (client-driven).
      payload:
        type: object
        required: [turn_type, player, participants]
        properties:
          turn_type: { $ref: '#/components/schemas/TurnTypeEnum' }
          player: { type: string }
          participants:
            type: array
            items: { type: string }
          slots:
            type: array
            items: { type: string }
            nullable: true

    TargetChosen:
      name: TargetChosen
      title: Target Chosen
      summary: Broadcast containing final description and current performer.
      payload:
        type: object
        required: [turn_type, description, player]
        properties:
          turn_type: { $ref: '#/components/schemas/TurnTypeEnum' }
          description: { type: string }
          player: { type: string }

    TeamVoteStarted:
      name: TeamVoteStarted
      title: Team Vote Started
      summary: Broadcast when a team voting session opens (teams & expected voters).
      payload:
        type: object
        required: [turn_type, title, teams, expected]
        properties:
          turn_type: { $ref: '#/components/schemas/TurnTypeEnum' }
          title: { type: string }
          teams:
            type: array
            items: { $ref: '#/components/schemas/Team' }
          expected: { type: integer }

    TurnSkipped:
      name: TurnSkipped
      title: Turn Skipped
      summary: Broadcast when a player skips a turn.
      payload:
        type: object
        required: [player, turn_type, title, new_score]
        properties:
          player: { type: string }
          turn_type: { $ref: '#/components/schemas/TurnTypeEnum' }
          title: { type: string }
          new_score: { type: integer }

    TurnCompletedNeedsVoting:
      name: TurnCompletedNeedsVoting
      title: Turn Completed (needs voting)
      summary: Broadcast when a turn needs a performance vote, including the potential prize.
      payload:
        type: object
        required: [player, turn_type, title, potential_prize]
        properties:
          player: { type: string }
          turn_type: { $ref: '#/components/schemas/TurnTypeEnum' }
          title: { type: string }
          potential_prize: { type: integer }

    TurnCompleted:
      name: TurnCompleted
      title: Turn Completed
      summary: Broadcast when a turn finishes without voting; includes new score for the performer or team participants.
      payload:
        type: object
        required: [player, turn_type, title, new_score]
        properties:
          player: { type: string }
          turn_type: { $ref: '#/components/schemas/TurnTypeEnum' }
          title: { type: string }
          new_score: { type: integer }

    VoteProgress:
      name: VoteProgress
      title: Vote Progress
      summary: List of players who have already voted for performance.
      payload:
        type: object
        required: [voted]
        properties:
          voted:
            type: array
            items: { type: string }
      examples:
        - payload:
            voted: [Bob, Carol]

    VoteFinished:
      name: VoteFinished
      title: Vote Finished
      summary: Final weighted average and awarded points (Dictator counts double).
      payload:
        type: object
        required: [average, award_points]
        properties:
          average:
            type: number
            format: float
          award_points:
            type: integer
          performer:
            type: string
            nullable: true
          new_score:
            type: integer
            nullable: true

    TeamVoteProgress:
      name: TeamVoteProgress
      title: Team Vote Progress
      summary: Who voted and current weighted counts per team (Dictator adds +2).
      payload:
        type: object
        required: [voted, counts]
        properties:
          voted:
            type: array
            items: { type: string }
          counts:
            type: object
            additionalProperties:
              type: integer
      examples:
        - payload:
            voted: [Bob, Carol, Dave]
            counts:
              Team0: 3
              Team1: 4

    TeamVoteFinished:
      name: TeamVoteFinished
      title: Team Vote Finished
      summary: Winner team and final weighted counts (Dictator adds +2).
      payload:
        type: object
        required: [winner_team, counts]
        properties:
          winner_team: { type: string }
          counts:
            type: object
            additionalProperties:
              type: integer

    PointsGiven:
      name: PointsGiven
      title: Points Given
      summary: Notification that points were added/subtracted to a player.
      payload:
        type: object
        required: [player, points, new_score]
        properties:
          player: { type: string }
          points: { type: integer }
          new_score: { type: integer }

    GameFinished:
      name: GameFinished
      title: Game Finished
      summary: Winner announcement; lobby will be cleaned afterwards.
      payload:
        type: object
        required: [winner]
        properties:
          winner: { type: string }
          points_to_win:
            type: integer
            nullable: true
          ended_at:
            type: string
            format: date-time
            nullable: true
          closing:
            type: boolean
            description: Hint that server will close and clean the lobby right after.

    LobbyClosed:
      name: LobbyClosed
      title: Lobby Closed
      summary: Confirmation that the lobby has been deleted/cleaned after game finish.
      payload:
        type: object
        required: [code]
        properties:
          code: { $ref: '#/components/schemas/LobbyCode' }

    Error:
      name: Error
      title: Error
      summary: Error message emitted by the server when an operation fails.
      payload:
        type: object
        properties:
          message:
            type: string
            description: Human-readable error message.

  schemas:
    # -----------------------
    # Common primitives/enums
    # -----------------------
    LobbyCode:
      type: string
      description: Unique 4-digit lobby code.
      pattern: '^[0-9]{4}$'

    GenderEnum:
      type: string
      description: Gender of the player.
      enum: [male, female]

    TurnTypeEnum:
      type: string
      description: Type of turn to progress to.
      enum: [challenge_type, group_challenge_type, secret_mission_type, target_challenge_type]

    # -----------------------
    # Domain models
    # -----------------------
    PlayerInfo:
      type: object
      required: [username, drinking, smoking, partnered, virgin, gender]
      properties:
        username: { type: string }
        drinking: { type: boolean }
        smoking: { type: boolean }
        partnered: { type: boolean }
        virgin: { type: boolean }
        gender: { $ref: '#/components/schemas/GenderEnum' }
        profile_pic:
          type: string
          nullable: true
          description: Optional identifier/relative path used internally.

    PlayerState:
      type: object
      required: [username, points, secret_missions, connected]
      properties:
        username: { type: string }
        points: { type: integer }
        role:
          type: string
          nullable: true
        secret_missions:
          type: array
          items: { type: string }
        connected: { type: boolean }

    ConnectedPlayer:
      type: object
      required: [username]
      properties:
        username: { type: string }
        profile_picture_url:
          type: string
          format: uri
          nullable: true

    GameState:
      type: object
      description: Full state of a lobby including lobby metadata, players, order and restrictions.
      properties:
        lobby:
          type: object
          description: Lobby metadata (may include host, current_turn, active, points_to_win, winner, created_at, started_at, ended_at).
        players:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/PlayerState'
        order:
          type: array
          items: { type: string }
        restrictions:
          type: object
          properties:
            males: { type: integer, minimum: 0 }
            females: { type: integer, minimum: 0 }

    Team:
      type: object
      required: [name, members]
      properties:
        name: { type: string }
        members:
          type: array
          items: { type: string }

    Challenge:
      type: object
      description: Generic challenge payload enriched by backend (includes icon URL).
      properties:
        title: { type: string }
        description: { type: string, nullable: true }
        group_challenge: { type: boolean, default: false }
        prize: { type: integer }
        voting: { type: boolean, default: false }
        icon:
            type: string
            format: uri

    RoleInfo:
      type: object
      required: [title, description, picture_url]
      properties:
        title: { type: string }
        description: { type: string }
        picture_url:
          type: string
          format: uri

    SecretMissionInfo:
      type: object
      required: [title, description, prize, punishment, picture_url]
      properties:
        title: { type: string }
        description: { type: string }
        prize: { type: integer }
        punishment: { type: integer }
        picture_url:
          type: string
          format: uri

    UpdateProfilePicturePayload:
      type: object
      description: Update or remove a player's profile picture.
      required: [code, player_name]
      properties:
        code: { $ref: '#/components/schemas/LobbyCode' }
        player_name: { type: string }
        remove:
          type: boolean
          default: false
        data_url:
          type: string
          pattern: '^data:image\/[A-Za-z0-9]+;base64,.+'
        image_base64: { type: string }
        extension:
          type: string
          enum: [png, jpg, jpeg, gif]
        filename: { type: string }
      anyOf:
        - properties: { remove: { const: true } }
          required: [code, player_name, remove]
        - anyOf:
            - required: [code, player_name, data_url]
            - required: [code, player_name, image_base64, extension]

    # -----------------------
    # Ack payloads (Socket.IO)
    # -----------------------
    AckError:
      type: object
      required: [ok, error]
      properties:
        ok: { type: boolean, const: false }
        error: { type: string }

    AckOkOnly:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean, const: true }

    AckCreateLobbySuccess:
      type: object
      required: [ok, code, connected_players]
      properties:
        ok: { type: boolean, const: true }
        code: { $ref: '#/components/schemas/LobbyCode' }
        connected_players:
          type: array
          items: { $ref: '#/components/schemas/ConnectedPlayer' }
        points_to_win:
          type: integer
          nullable: true
          description: Echoed when provided (>0).

    AckJoinLobbySuccess:
      type: object
      required: [connected_players]
      properties:
        connected_players:
          type: array
          items: { $ref: '#/components/schemas/ConnectedPlayer' }

    AckLeaveLobbySuccess:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean, const: true }
        host:
          type: string
          nullable: true
          description: New host username, or null if lobby was removed.

    AckUpdatePlayerSuccess:
      type: object
      required: [ok, player, profile_picture_url]
      properties:
        ok: { type: boolean, const: true }
        player: { type: string }
        profile_picture_url:
          type: string
          format: uri

    AckGetUserInfoSuccess:
      type: object
      required: [ok, player_info]
      properties:
        ok: { type: boolean, const: true }
        player_info:
          type: object
          required: [username, drinking, smoking, partnered, virgin, gender, profile_picture_url]
          properties:
            username: { type: string }
            drinking: { type: boolean }
            smoking: { type: boolean }
            partnered: { type: boolean }
            virgin: { type: boolean }
            gender: { $ref: '#/components/schemas/GenderEnum' }
            profile_picture_url:
              type: string
              format: uri

    AckGetPlayerStateSuccess:
      type: object
      required: [ok, player_state]
      properties:
        ok: { type: boolean, const: true }
        player_state: { $ref: '#/components/schemas/PlayerState' }

    AckUpdateProfilePictureSuccess:
      type: object
      required: [ok, player, profile_picture_url, removed]
      properties:
        ok: { type: boolean, const: true }
        player: { type: string }
        profile_picture_url:
          type: string
          format: uri
        removed: { type: boolean }

    AckNextTurnChallengeSuccess:
      type: object
      description: Returned for secret_mission and target_challenge.
      required: [ok, challenge]
      properties:
        ok: { type: boolean, const: true }
        challenge: { $ref: '#/components/schemas/Challenge' }
        player:
          type: string
          description: Current turn player (present in some turn types).
        turn_type:
          $ref: '#/components/schemas/TurnTypeEnum'

    AckCompleteTurnNeedsVoting:
      type: object
      required: [ok, potential_prize, voting]
      properties:
        ok: { type: boolean, const: true }
        potential_prize: { type: integer }
        voting: { type: boolean }

    AckVoteFinished:
      type: object
      required: [ok, average, award_points]
      properties:
        ok: { type: boolean, const: true }
        average: { type: number, format: float }
        award_points: { type: integer }
        performer:
          type: string
          nullable: true
        new_score:
          type: integer
          nullable: true

    AckTeamVoteFinished:
      type: object
      required: [ok, winner_team, counts]
      properties:
        ok: { type: boolean, const: true }
        winner_team: { type: string }
        counts:
          type: object
          additionalProperties:
            type: integer

    AckGetRoleInfoSuccess:
      type: object
      required: [ok, role]
      properties:
        ok: { type: boolean, const: true }
        role: { $ref: '#/components/schemas/RoleInfo' }

    AckGetPlayerSecretMissionsSuccess:
      type: object
      required: [ok, missions]
      properties:
        ok: { type: boolean, const: true }
        missions:
          type: array
          items: { $ref: '#/components/schemas/SecretMissionInfo' }
