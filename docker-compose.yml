services:
  redis:
    image: redis:7
    container_name: redis
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - redis_data:/data

  flask_api:
    build: .
    container_name: flask_api
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_started
    ports:
      - "${FLASK_PORT}:5000"
    volumes:
      - .:/app

volumes:
  redis_data:
