<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
<script>
  const socket = io("http://localhost:5000/api/v1/lobby");

  socket.on("connect", () => {
    console.log("Connected:", socket.id);
    socket.emit("create_lobby", {
      player: {
        username: "Uri",
        drinking: true,
        smoking: false,
        partnered: true,
        virgin: false,
        gender: "male"
      }
    }, (ack) => {
        console.log("Lobby created:", ack);
    });
  });
</script>
